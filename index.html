<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到大图书馆</title>
    <link rel="icon" type="image/png" href="https://images.moecm.com/images/2026/06/16/ICON.png">

    <!-- Google Fonts: medieval-inspired serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #c9a050;
            --gold-light: #e0c878;
            --gold-dark: #8b6914;
            --crimson: #6b1a2a;
            --crimson-light: #9b2d3e;
            --parchment: #d4c5a9;
            --parchment-dark: #b8a080;
            --stone: #1a1510;
            --stone-light: #2a2218;
            --ember: #d4843a;
            --magic-purple: #3a1a4a;
            --text-main: #e0d5c0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Cinzel", "Noto Serif SC", "STSong", Georgia, serif;
            background: var(--stone);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Stone Wall Texture ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                /* Stone block lines */
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 58px,
                    rgba(0,0,0,0.25) 58px,
                    rgba(0,0,0,0.25) 60px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 78px,
                    rgba(0,0,0,0.2) 78px,
                    rgba(0,0,0,0.2) 80px
                ),
                /* Uneven offsets for masonry look */
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 116px,
                    rgba(0,0,0,0.25) 116px,
                    rgba(0,0,0,0.25) 118px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 158px,
                    rgba(0,0,0,0.2) 158px,
                    rgba(0,0,0,0.2) 160px
                ),
                radial-gradient(ellipse at 50% 0%, rgba(60,20,20,0.5) 0%, transparent 70%),
                radial-gradient(ellipse at 50% 100%, rgba(20,10,30,0.6) 0%, transparent 70%);
        }

        /* ── Floating Magic Particles ── */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--gold-light);
            border-radius: 50%;
            animation: floatUp linear infinite;
            box-shadow: 0 0 6px 2px rgba(224, 200, 120, 0.6);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        /* ── Main Layout ── */
        .page-wrapper {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* ── Ornate Top Border ── */
        .ornament-top {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            opacity: 0.8;
        }
        .ornament-top .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dark), var(--gold), var(--gold-dark), transparent);
        }
        .ornament-top .diamond {
            color: var(--gold);
            font-size: 0.7rem;
            text-shadow: 0 0 8px var(--gold);
        }

        /* ── Hero Image ── */
        .hero-image-wrap {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin-bottom: 2.5rem;
            border: 3px solid var(--gold-dark);
            border-radius: 4px;
            box-shadow:
                0 0 30px rgba(180, 130, 40, 0.3),
                0 0 80px rgba(120, 60, 20, 0.25),
                inset 0 0 30px rgba(0,0,0,0.4);
            overflow: hidden;
            aspect-ratio: 16 / 9;
            background: var(--stone-light);
        }

        .hero-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 20s ease;
        }

        .hero-image-wrap:hover img {
            transform: scale(1.05);
        }

        /* Corner ornaments on hero */
        .hero-image-wrap::before,
        .hero-image-wrap::after {
            content: '✦';
            position: absolute;
            color: var(--gold);
            font-size: 1.2rem;
            z-index: 2;
            text-shadow: 0 0 10px var(--gold);
            pointer-events: none;
        }
        .hero-image-wrap::before { top: 8px; left: 12px; }
        .hero-image-wrap::after  { bottom: 8px; right: 12px; }

        /* ── Main Title ── */
        .title-block {
            text-align: center;
            margin-bottom: 1.2rem;
        }

        .title-english {
            font-family: "Cinzel Decorative", "Cinzel", serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5em;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            text-shadow: 0 0 20px rgba(200, 150, 60, 0.5);
        }

        h1 {
            font-family: "Noto Serif SC", "STSong", "Songti SC", serif;
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            color: var(--gold-light);
            text-shadow:
                0 0 30px rgba(224, 200, 120, 0.5),
                0 2px 4px rgba(0,0,0,0.6);
            line-height: 1.3;
        }

        /* ── Subtitle ── */
        .subtitle {
            font-family: "Cinzel", serif;
            font-size: 0.95rem;
            letter-spacing: 0.35em;
            color: var(--parchment-dark);
            margin-bottom: 1.8rem;
            text-transform: uppercase;
        }

        /* ── Ornate Divider ── */
        .divider-ornate {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            width: 100%;
            max-width: 380px;
        }
        .divider-ornate .bar {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dark), var(--gold));
        }
        .divider-ornate .bar.right {
            background: linear-gradient(90deg, var(--gold), var(--gold-dark), transparent);
        }
        .divider-ornate .icon {
            color: var(--gold);
            font-size: 1rem;
            text-shadow: 0 0 12px var(--gold);
            animation: flicker 2s ease-in-out infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ── Quote ── */
        .quote-block {
            position: relative;
            text-align: center;
            max-width: 520px;
            margin: 0 auto 2.5rem;
            padding: 2rem 1.5rem;
            /* Parchment effect */
            background:
                radial-gradient(ellipse at center, rgba(180,150,100,0.12) 0%, transparent 70%);
            border-left: 1px solid rgba(200,160,80,0.3);
            border-right: 1px solid rgba(200,160,80,0.3);
        }

        .quote-block p {
            font-family: "Noto Serif SC", "STSong", serif;
            font-style: italic;
            font-size: 1.05rem;
            line-height: 2;
            color: var(--parchment);
            letter-spacing: 0.06em;
        }

        .quote-block .author {
            display: block;
            margin-top: 1rem;
            font-style: normal;
            font-size: 0.85rem;
            color: var(--parchment-dark);
            letter-spacing: 0.15em;
        }

        /* Candle glow effect on quote */
        .quote-block::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 20px;
            background: radial-gradient(ellipse at center, rgba(220, 160, 60, 0.4) 0%, transparent 70%);
            animation: flicker 2.5s ease-in-out infinite;
        }

        /* ── Bookshelf ── */
        .bookshelf-section {
            width: 100%;
            max-width: 560px;
            margin-top: 0.5rem;
        }

        .shelf-label {
            text-align: center;
            font-family: "Cinzel", serif;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: var(--parchment-dark);
            margin-bottom: 0.8rem;
            text-transform: uppercase;
        }

        .books-row {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 0.4rem;
            flex-wrap: wrap;
            padding: 0 0.5rem;
        }

        .book {
            width: 28px;
            border-radius: 3px 5px 5px 3px;
            transition: all 0.35s ease;
            cursor: default;
            position: relative;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.5);
        }

        .book::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 3px;
            right: 3px;
            height: 2px;
            background: rgba(255,255,255,0.08);
            border-radius: 1px;
        }

        .book:hover {
            transform: translateY(-10px);
            box-shadow: 2px 6px 14px rgba(0,0,0,0.6), 0 0 12px rgba(200,160,60,0.4);
            filter: brightness(1.2);
        }

        /* Medieval tome colors */
        .book:nth-child(1)  { background: linear-gradient(180deg, #4a1a1a, #2e0a0a); height: 110px; }
        .book:nth-child(2)  { background: linear-gradient(180deg, #3a2a4a, #1a0a2a); height: 128px; }
        .book:nth-child(3)  { background: linear-gradient(180deg, #5a3a1a, #2a1a08); height: 100px; }
        .book:nth-child(4)  { background: linear-gradient(180deg, #1a3a3a, #0a1a1a); height: 135px; }
        .book:nth-child(5)  { background: linear-gradient(180deg, #4a1a3a, #2a0a1a); height: 115px; }
        .book:nth-child(6)  { background: linear-gradient(180deg, #6b1a2a, #3a0a12); height: 122px; }
        .book:nth-child(7)  { background: linear-gradient(180deg, #3a2a1a, #1a1208); height: 108px; }
        .book:nth-child(8)  { background: linear-gradient(180deg, #1a1a3a, #0a0a1a); height: 132px; }
        .book:nth-child(9)  { background: linear-gradient(180deg, #2a4a2a, #0a2a0a); height: 112px; }
        .book:nth-child(10) { background: linear-gradient(180deg, #5a2a1a, #2a1206); height: 125px; }
        .book:nth-child(11) { background: linear-gradient(180deg, #3a1a2a, #1a0a12); height: 105px; }
        .book:nth-child(12) { background: linear-gradient(180deg, #1a2a1a, #081208); height: 118px; }
        .book:nth-child(13) { background: linear-gradient(180deg, #4a2a2a, #2a1212); height: 130px; }
        .book:nth-child(14) { background: linear-gradient(180deg, #2a1a3a, #120a1a); height: 114px; }

        /* ── Shelf Board ── */
        .shelf-board {
            width: 100%;
            max-width: 520px;
            height: 6px;
            margin: 0 auto;
            background: linear-gradient(180deg, #3a2210, #5a3a1a, #3a2210);
            border-radius: 1px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.5);
        }

        /* ── Bottom Ornament ── */
        .ornament-bottom {
            margin-top: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            opacity: 0.6;
        }
        .ornament-bottom .sigil {
            font-size: 2rem;
            color: var(--gold);
            text-shadow: 0 0 15px var(--gold);
            animation: flicker 3s ease-in-out infinite;
        }

        /* ── Footer ── */
        footer {
            margin-top: auto;
            padding: 2rem 0 1rem;
            text-align: center;
            font-family: "Cinzel", serif;
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            color: rgba(180,150,120,0.5);
            text-transform: uppercase;
        }

        /* ── Subtle Vignette Overlay ── */
        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            box-shadow: inset 0 0 200px 60px rgba(0,0,0,0.7);
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
                letter-spacing: 0.12em;
            }
            .title-english {
                font-size: 0.9rem;
                letter-spacing: 0.35em;
            }
            .hero-image-wrap {
                max-width: 100%;
                margin-bottom: 1.8rem;
            }
            .quote-block {
                padding: 1.5rem 1rem;
            }
            .quote-block p {
                font-size: 0.95rem;
                line-height: 1.8;
            }
            .book {
                width: 22px;
            }
        }

        @media (max-width: 400px) {
            h1 { font-size: 1.7rem; }
            .title-english { font-size: 0.7rem; letter-spacing: 0.2em; }
            .book { width: 18px; }
            .book:nth-child(n+11) { display: none; }
        }
    </style>
</head>
<body>

    <!-- Stone texture / vignette -->
    <div class="vignette"></div>

    <!-- Floating magic particles -->
    <div class="particles" id="particles" aria-hidden="true"></div>

    <!-- Main content -->
    <div class="page-wrapper">

        <!-- Top ornament -->
        <div class="ornament-top">
            <span class="line"></span><span class="diamond">◆</span><span class="line"></span>
            <span class="diamond">◇</span><span class="line"></span><span class="diamond">◆</span>
            <span class="line"></span>
        </div>

        <!-- Hero image -->
        <div class="hero-image-wrap">
            <img src="https://images.moecm.com/images/2026/06/16/首图.png" alt="大图书馆首图 — 魔女的藏书阁">
        </div>

        <!-- Title -->
        <div class="title-block">
            <div class="title-english">✦ MENTHOL LIB ✦</div>
            <h1>欢迎来到大图书馆</h1>
        </div>

        <div class="subtitle">— 深山古堡 · 魔女の藏书阁 —</div>

        <!-- Ornate divider -->
        <div class="divider-ornate">
            <span class="bar"></span>
            <span class="icon">🕯️</span>
            <span class="bar right"></span>
        </div>

        <!-- Quote -->
        <div class="quote-block">
            <p>
                「 于万卷古籍中探寻真理，<br>
                在魔法与星辰的辉映下，<br>
                每一页泛黄的手稿<br>
                都藏着一个世界的秘密。 」
            </p>
            <span class="author">—— 魔女 MENTHOL 的藏书阁</span>
        </div>

        <!-- Bookshelf -->
        <div class="bookshelf-section">
            <div class="shelf-label">· 古籍典藏 ·</div>
            <div class="books-row">
                <div class="book"></div><div class="book"></div><div class="book"></div>
                <div class="book"></div><div class="book"></div><div class="book"></div>
                <div class="book"></div><div class="book"></div><div class="book"></div>
                <div class="book"></div><div class="book"></div><div class="book"></div>
                <div class="book"></div><div class="book"></div>
            </div>
            <div class="shelf-board"></div>
        </div>

        <!-- Bottom sigil -->
        <div class="ornament-bottom">
            <span class="sigil">⛤</span>
        </div>

    </div>

    <footer>
        &copy; 2026 MENTHOL LIB · 大图书馆 · 群山深处
    </footer>

    <script>
        // ── Generate floating magic particles ──
        (function() {
            const container = document.getElementById('particles');
            const count = 35;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 10 + 8) + 's';
                p.style.animationDelay = (Math.random() * 12) + 's';
                p.style.width = (Math.random() * 3 + 1) + 'px';
                p.style.height = p.style.width;
                const colors = ['#e0c878','#c9a050','#d4a060','#f0d890','#b89040'];
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.boxShadow = '0 0 ' + (Math.random() * 8 + 3) + 'px ' + (Math.random() * 2 + 1) + 'px ' + p.style.background;
                container.appendChild(p);
            }
        })();
    </script>

</body>
</html>
